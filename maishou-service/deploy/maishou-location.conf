location = /maishou {
    return 302 /maishou/;
}

location = /maishou/ {
    root /home/wsf/productC/site;
    try_files /maishou/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}

location ^~ /maishou/ {
    root /home/wsf/productC/site;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}

location = /maishou/admin {
    return 302 /maishou/admin/;
}

location = /maishou/admin/ {
    root /home/wsf/productC/site;
    try_files /maishou/admin/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://wsfile.cn; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}

location ^~ /maishou/admin/ {
    root /home/wsf/productC/site;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://wsfile.cn; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}

location = /maishou/admin/erp-users {
    return 302 /maishou/admin/erp-users/;
}

location = /maishou/admin/erp-users/ {
    root /home/wsf/productC/site;
    try_files /maishou/admin/erp-users/index.html =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https://wsfile.cn; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}

location ^~ /maishou/api/online-table/ {
    proxy_pass http://127.0.0.1:43900/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 8m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /maishou/api/ {
    client_max_body_size 16m;
    proxy_pass http://127.0.0.1:4600/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    proxy_buffering off;
}
