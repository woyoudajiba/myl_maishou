<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>在线选品表 · 找商品</title><link rel="icon" href="/maishou/admin/favicon.svg"><link rel="stylesheet" href="/maishou/table/table.css"><script defer src="/maishou/table/table.js"></script></head><body>
<main class="shell"><header><a class="brand" href="/maishou/table/">找商品<span>在线选品表</span></a><nav><a href="/maishou/admin/">账号与用量</a><span id="identity"></span><button id="logout" class="secondary" hidden>退出登录</button></nav></header>
<section id="loginView" class="login panel"><h1>登录选品表</h1><p class="muted">使用 TDL 账号，与桌面端共用选品表和商品处理进度。</p><form id="loginForm"><label>账号<input name="username" required maxlength="120" autocomplete="username"></label><label>密码<input name="password" type="password" required maxlength="512" autocomplete="current-password"></label><p id="loginError" role="alert"></p><button type="submit">登录</button></form></section>
<section id="tableView" hidden><div class="heading"><div><h1>在线选品表</h1><p class="muted">录入商品、确认任务、查看处理进度。确认后，由运行中的桌面端领取并处理。</p></div><button id="createTable" hidden>创建共享选品表</button></div>
<div class="toolbar"><label>选品表<select id="tablePicker" aria-label="选品表"></select></label><label class="search">查找<input id="search" type="search" placeholder="货号、链接、标题、确认人…"></label><button id="find">查找</button><button id="refresh" class="secondary">刷新</button><button id="addRow">新增商品</button><button id="bulkRows" class="secondary">粘贴表格</button><button id="history" class="secondary">修改记录</button><button id="exportRows" class="secondary">导出 CSV</button></div><p id="message" role="status" aria-live="polite"></p>
<div class="table-wrap panel"><table><thead><tr><th>行号</th><th>货号</th><th>商品 / 链接</th><th>任务确认人</th><th>人工确认</th><th>处理进度</th><th>互拓编码</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><footer><span id="tableStats" class="muted"></span><div><button id="prev" class="secondary">上一页</button><span id="pageInfo"></span><button id="next" class="secondary">下一页</button></div></footer><p class="muted footnote">表格资料在各端同步；浏览器负责录入与确认，平台登录、图片审核及互拓采集在桌面端继续。</p></section></main>
<dialog id="rowDialog"><form id="rowForm"><div class="dialog-heading"><h2 id="rowTitle">新增商品</h2><button type="button" id="closeRow" class="secondary">关闭</button></div><div class="form-grid"><label>货号<input name="articleNo" maxlength="120"></label><label class="wide">商品链接<input name="sourceUrl" maxlength="2000" placeholder="粘贴淘宝、抖音或供应商分享链接"></label><label class="wide">标题<input name="title" maxlength="300"></label><label class="wide">备注<textarea name="note" rows="2" maxlength="2000"></textarea></label></div><details><summary>供应商、选品及发货信息</summary><div id="extraFields" class="form-grid"></div></details><p id="rowError" role="alert"></p><div class="dialog-actions"><button type="submit" id="saveRow">保存商品</button></div></form></dialog>
<dialog id="bulkDialog"><form id="bulkForm"><div class="dialog-heading"><h2>粘贴表格商品</h2><button type="button" id="closeBulk" class="secondary">关闭</button></div><p class="muted">可从 Excel 复制：货号、商品链接、标题、备注，按列粘贴；也可每行一个链接。最多1000行，保存后仍需逐项确认。</p><textarea id="bulkText" rows="10" required placeholder="每行一个商品链接，或粘贴四列表格"></textarea><p id="bulkError" role="alert"></p><button type="submit">导入选品表</button></form></dialog>
<dialog id="historyDialog"><div class="dialog-heading"><h2>修改记录</h2><button id="closeHistory" class="secondary">关闭</button></div><p id="historyMessage" role="status"></p><div id="historyRows"></div><div id="historyDetail"></div></dialog>
</body></html>
