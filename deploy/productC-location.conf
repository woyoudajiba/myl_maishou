# Public, read-only desktop release feed. No account/model data lives here.
location = /productC {
    return 302 /productC/;
}
location = /productC/ {
    root /home/wsf;
    try_files /productC/index.html =404;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /productC/updates/ {
    alias /home/wsf/productC/updates/;
    autoindex off;
    if ($uri ~ "/\.") { return 404; }
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /productC/online-table/ {
    proxy_pass http://127.0.0.1:43900/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    client_max_body_size 8m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /productC/ {
    return 404;
}
